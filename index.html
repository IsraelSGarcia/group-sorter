<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Sorter</title>
    <style>
        :root {
            /* Lighter dark mode for better visibility */
            --bg-color: #1a1a1a; 
            --panel-bg: #222222;
            --text-primary: #f0f0f0;
            --text-secondary: #999999;
            --accent: #2b7de9;
            --accent-hover: #408bf0;
            --border: #3a3a3a;
            --danger: #ff5555;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            /* Robust font stack for Helvetica feel */
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 400;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        /* Layout */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 15px; /* Reduced padding */
            gap: 20px; /* Reduced gap */
            overflow-y: auto;
            flex-shrink: 0;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px; /* Reduced padding */
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        /* Typography */
        h2, h3 {
            margin: 0 0 10px 0; /* Reduced margin */
            font-weight: 600; 
            letter-spacing: -0.01em;
        }
        
        h2 { font-size: 22px; color: var(--text-primary); margin-bottom: 20px;}
        h3 { font-size: 12px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; margin-bottom: 8px; }
        
        p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        /* Sections */
        .section {
            display: flex;
            flex-direction: column;
        }

        /* Inputs */
        .input-group { margin-bottom: 8px; } /* Reduced margin */
        
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        input[type="text"], select {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 0;
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
            border-radius: 0;
        }

        input[type="text"]:focus, select:focus {
            border-bottom-color: var(--accent);
        }
        
        select {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path fill="%23999" d="M0 0l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 0 center;
        }

        /* Fix for white background in dropdowns on some browsers */
        select option {
            background-color: var(--panel-bg);
            color: var(--text-primary);
        }

        /* Buttons */
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px; /* Compact padding */
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover { background-color: var(--accent-hover); }
        button:active { transform: translateY(1px); }
        
        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        button.secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }
        
        button.danger {
            background-color: transparent;
            border: 1px solid #552222;
            color: var(--danger);
        }
        button.danger:hover {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
        }
        
        button.icon-only {
            padding: 4px;
            width: auto;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px; 
        }
        button.icon-only:hover { color: var(--text-primary); background: transparent; }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .add-group-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        /* List & Sorting UI */
        .sort-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sort-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        
        .sort-item.disabled { opacity: 0.5; }

        .sort-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid var(--text-secondary);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        input[type="checkbox"]:checked {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 1px;
            width: 3px;
            height: 6px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .sort-controls { display: flex; gap: 2px; }
        .sort-controls button {
            background: transparent;
            color: var(--text-secondary);
            padding: 1px 5px;
            font-size: 11px;
        }
        .sort-controls button:hover { color: var(--text-primary); }
        .sort-controls button:disabled { opacity: 0.3; cursor: not-allowed; }

        .sort-item {
            cursor: grab;
            transition: background 0.15s, opacity 0.15s, border-color 0.15s;
        }
        .sort-item:active { cursor: grabbing; }
        .sort-item.dragging { opacity: 0.35; }
        .sort-item.drag-over {
            border-color: var(--accent);
            background: rgba(43, 125, 233, 0.15);
        }

        /* Sorting Dropdown Area */
        .sorting-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        /* List Header & Search Actions */
        .list-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .header-count-badge {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .list-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 220px;
            padding: 5px 26px 5px 8px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-primary);
            transition: border-color 0.2s, width 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            width: 270px;
        }

        .search-box button {
            position: absolute;
            right: 4px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 11px;
            display: none;
        }

        .search-box button:hover {
            color: var(--text-primary);
        }

        .small-action-btn {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* Tree View */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        ul ul {
            padding-left: 12px; /* Compact indent */
            border-left: 1px solid var(--border);
            margin-left: 6px; 
        }

        /* Group Headers */
        .group-label {
            padding: 4px 0; /* Compact padding */
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 13px; 
            font-weight: 500;
            color: var(--text-primary);
            transition: color 0.2s;
        }
        .group-label:hover { color: var(--accent); }

        .group-label::before {
            content: '▼';
            font-size: 10px;
            margin-right: 8px;
            color: #888; 
            display: inline-block;
            transition: transform 0.2s;
        }
        .group-label.collapsed::before { transform: rotate(-90deg); }
        .group-content.collapsed { display: none; }
        
        .count-badge {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 6px;
            font-weight: 400;
        }

        /* Items */
        .item-node {
            position: relative; /* For absolute actions */
            display: flex;
            justify-content: space-between;
            align-items: center; /* Center vertically */
            padding: 4px 0; /* Compact items */
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            min-height: 28px;
        }
        
        .item-node:last-child { border-bottom: none; }

        .item-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .item-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .date-line {
            font-size: 10px;
            color: var(--text-secondary);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-variant-numeric: tabular-nums; /* Helps align numbers */
        }
        
        .item-actions {
            display: flex;
            gap: 6px;
            opacity: 0; 
            transition: opacity 0.2s;
            position: absolute;
            right: 0;
            background-color: var(--bg-color); /* Cover underlying text */
            padding-left: 10px;
            height: 100%;
            align-items: center;
        }
        
        .item-node:hover .item-actions { opacity: 1; }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 10px;
            color: var(--text-secondary);
            padding: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        .action-btn:hover { color: var(--text-primary); }
        .action-btn.del:hover { color: var(--danger); }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 80px;
            font-weight: 300;
            font-size: 13px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.open { display: flex; }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            width: 400px;
            border-radius: 6px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }
        
        .modal-header {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .modal-actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        
        <!-- Saved Groups -->
        <div class="section" id="savedGroupsSection">
            <h3>Saved Groups</h3>
            <div style="display: flex; gap: 6px; align-items: center;">
                <select id="savedGroupSelect" onchange="onSavedGroupSelected()" style="flex: 1;">
                    <option value="">Scanning groups/...</option>
                </select>
                <button class="secondary icon-only" onclick="loadGroupFilesList()" title="Refresh files" style="padding: 6px 10px; font-size: 13px;">↻</button>
            </div>
            <div class="btn-row" style="margin-top: 8px;">
                <button id="saveBtn" style="flex: 1;" onclick="saveCurrentGroupFile()" title="Save changes to disk (Ctrl+S)">Save</button>
                <button class="secondary" style="flex: 1;" onclick="saveAsNewGroupFile()" title="Save as a new group file">Save As...</button>
            </div>
            <div id="saveStatusMsg" style="font-size: 11px; color: #2ecc71; margin-top: 4px; display: none;">Saved to disk ✓</div>
        </div>

        <!-- Add Item -->
        <div class="section">
            <h3>Add Item</h3>
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="inpName" placeholder="Enter identifier...">
            </div>
            <div id="dynamicInputs"></div>
            <button onclick="addItem()" style="margin-top: 8px;">Add Item</button>
        </div>

        <!-- Groups -->
        <div class="section">
            <h3>Grouping</h3>
            <p>Drag items or click arrows to reorder hierarchy.</p>
            <div id="sortContainer" class="sort-list"></div>
            
            <div class="add-group-row">
                <div style="flex-grow:1">
                    <input type="text" id="newGroupKey" placeholder="New Category" list="dl_newGroupKey" autocomplete="off">
                    <datalist id="dl_newGroupKey"></datalist>
                </div>
                <button class="icon-only" onclick="addNewGroupKey()" title="Add Category">+</button>
            </div>
        </div>

        <!-- Sorting -->
        <div class="section">
            <h3>Sorting</h3>
            <div class="sorting-area">
                <div style="flex-grow:1">
                    <label>Sort Leaves By</label>
                    <select id="sortSelect" onchange="changeSort()">
                        <option value="Creation Date">Creation Date</option>
                        <option value="Modification Date">Modification Date</option>
                        <option value="Alphabetical">Alphabetical</option>
                    </select>
                </div>
                <button id="sortOrderBtn" class="secondary" onclick="toggleSortOrder()" title="Toggle Order" style="padding: 6px 10px;">▼</button>
            </div>
        </div>
        
        <!-- Data -->
        <div class="section" style="margin-top: auto;">
            <div class="btn-row">
                <button class="secondary" style="flex:1" onclick="exportData()">Export</button>
                <button class="secondary" style="flex:1" onclick="document.getElementById('fileInput').click()">Import</button>
            </div>
            <input type="file" id="fileInput" accept=".json" onchange="importData(this)">
            
            <div class="btn-row">
                <button class="secondary" style="flex:1; border:none; font-size:10px;" onclick="loadExample()">Load Example</button>
                <button class="danger" style="flex:1; border:none; font-size:10px;" onclick="clearAll()">Clear All</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="list-header-row">
            <div style="display: flex; align-items: baseline; gap: 10px;">
                <h2 style="margin-bottom: 0;">List View</h2>
                <span id="itemCountHeader" class="header-count-badge"></span>
            </div>
            <div class="list-header-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search items... (Press /)" oninput="handleSearch(this.value)" autocomplete="off">
                    <button id="clearSearchBtn" onclick="clearSearch()" title="Clear search">✕</button>
                </div>
                <button class="secondary small-action-btn" onclick="expandAllGroups()" title="Expand All Groups">Expand All</button>
                <button class="secondary small-action-btn" onclick="collapseAllGroups()" title="Collapse All Groups">Collapse All</button>
            </div>
        </div>
        <div id="treeRoot"></div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Item</div>
            <div class="input-group">
                <label>Name</label>
                <input type="text" id="editName">
            </div>
            <div id="editDynamicContainer"></div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeModal()">Cancel</button>
                <button onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const CREATED_KEY = "Creation Date";
        const MODIFIED_KEY = "Modification Date";
        const NAME_KEY = "Alphabetical";
        const SYSTEM_KEYS = [CREATED_KEY, MODIFIED_KEY, NAME_KEY];

        let items = [];
        let groupConfigs = []; 
        let currentSort = CREATED_KEY;
        let isReverse = false; 
        let editingItem = null;

        // --- Utilities ---
        
        function pad(n) {
            return n.toString().padStart(2, '0');
        }

        // Compact format: YYYY/MM/DD
        function formatDate(isoStr) {
            if (!isoStr) return "";
            const d = new Date(isoStr);
            if (isNaN(d.getTime())) return "";
            const year = d.getFullYear();
            const month = pad(d.getMonth() + 1);
            const day = pad(d.getDate());
            return `${year}/${month}/${day}`;
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return "";
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function generateId(prefix = 'item') {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return `${prefix}_${crypto.randomUUID().replace(/-/g, '').slice(0, 12)}`;
            }
            return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
        }

        function getUniqueCategoryValues(categoryKey) {
            const valuesSet = new Set();
            items.forEach(item => {
                const val = (item.attributes && item.attributes[categoryKey] !== undefined)
                    ? item.attributes[categoryKey]
                    : item[categoryKey];
                if (val !== undefined && val !== null && val !== "" && val !== "Unspecified") {
                    valuesSet.add(String(val).trim());
                }
            });
            return Array.from(valuesSet).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
        }

        function updateNewCategoryAutocomplete() {
            const dl = document.getElementById('dl_newGroupKey');
            if (!dl) return;

            const activeKeys = new Set(groupConfigs.map(g => g.name));
            const availableKeys = new Set();
            items.forEach(item => {
                if (item.attributes) {
                    Object.keys(item.attributes).forEach(k => {
                        if (!activeKeys.has(k) && !SYSTEM_KEYS.includes(k)) {
                            availableKeys.add(k);
                        }
                    });
                } else {
                    Object.keys(item).forEach(k => {
                        if (!activeKeys.has(k) && !SYSTEM_KEYS.includes(k) && k !== 'Name' && k !== 'name' && k !== 'id' && !k.startsWith('_')) {
                            availableKeys.add(k);
                        }
                    });
                }
            });

            dl.innerHTML = Array.from(availableKeys).sort().map(k => `<option value="${escapeHtml(k)}">`).join('');
        }

        // --- Core Logic ---

        function addItem() {
            const nameInp = document.getElementById('inpName');
            const name = nameInp.value.trim();

            if (!name) {
                // Minimalist error feedback
                nameInp.style.borderBottomColor = 'var(--danger)';
                setTimeout(() => nameInp.style.borderBottomColor = 'var(--border)', 2000);
                return;
            }

            const nowIso = new Date().toISOString();
            const attributes = {};

            groupConfigs.forEach(config => {
                const key = config.name;
                const inp = document.getElementById('inp_' + key);
                let val = inp ? inp.value.trim() : "";
                attributes[key] = val || "Unspecified";
                if (inp) inp.value = ''; 
            });

            const newItem = { 
                id: generateId('char'),
                name: name,
                createdAt: nowIso,
                updatedAt: nowIso,
                attributes: attributes
            };

            items.push(newItem);
            nameInp.value = '';
            updateDynamicInputs();
            renderTree();
        }
        
        function deleteItem(itemToDelete) {
            const itemName = itemToDelete.name || itemToDelete.Name || 'Item';
            if (!confirm(`Are you sure you want to delete "${itemName}"?`)) return;
            
            const index = items.findIndex(i => (itemToDelete.id && i.id === itemToDelete.id) || i === itemToDelete);
            if (index > -1) {
                items.splice(index, 1);
                updateDynamicInputs();
                renderTree();
            }
        }

        // --- Edit Logic ---
        
        function openEditModal(item) {
            editingItem = item;
            document.getElementById('editName').value = item.name || item.Name || '';
            
            const container = document.getElementById('editDynamicContainer');
            container.innerHTML = '';

            groupConfigs.forEach(config => {
                const key = config.name;
                const uniqueValues = getUniqueCategoryValues(key);
                const datalistId = `edit_dl_${encodeURIComponent(key)}`;
                const val = (item.attributes && item.attributes[key] !== undefined)
                    ? item.attributes[key]
                    : (item[key] || '');

                const div = document.createElement('div');
                div.className = 'input-group';
                div.innerHTML = `
                    <label>${escapeHtml(key)}</label>
                    <input type="text" id="edit_inp_${escapeHtml(key)}" value="${escapeHtml(val)}" list="${datalistId}" autocomplete="off">
                    <datalist id="${datalistId}">
                        ${uniqueValues.map(v => `<option value="${escapeHtml(v)}">`).join('')}
                    </datalist>
                `;
                container.appendChild(div);
            });

            document.getElementById('editModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('open');
            editingItem = null;
        }

        function saveEdit() {
            if (!editingItem) return;

            const newName = document.getElementById('editName').value.trim();
            if (!newName) return alert("Name cannot be empty");

            editingItem.name = newName;
            if (!editingItem.attributes) editingItem.attributes = {};

            groupConfigs.forEach(config => {
                const inp = document.getElementById('edit_inp_' + config.name);
                if (inp) {
                    editingItem.attributes[config.name] = inp.value.trim() || "Unspecified";
                }
            });

            editingItem.updatedAt = new Date().toISOString();

            closeModal();
            updateDynamicInputs();
            renderTree();
        }

        // --- Group Management ---

        function addNewGroupKey() {
            const inp = document.getElementById('newGroupKey');
            const newName = inp.value.trim();
            
            if(!newName) return;
            if(groupConfigs.some(g => g.name === newName)) {
                alert("Category already exists.");
                return;
            }
            if(SYSTEM_KEYS.includes(newName)) {
                alert("Name reserved.");
                return;
            }

            groupConfigs.push({ name: newName, active: true });
            
            inp.value = '';
            updateDynamicInputs();
            updateSortUI();
            renderTree();
        }

        function removeGroupKey(name) {
            if(confirm(`Remove category "${name}" completely?`)) {
                groupConfigs = groupConfigs.filter(g => g.name !== name);
                updateDynamicInputs();
                updateSortUI();
                renderTree();
            }
        }

        function toggleGroupKey(index) {
            groupConfigs[index].active = !groupConfigs[index].active;
            updateSortUI();
            renderTree();
        }

        function changeSort() {
            const select = document.getElementById('sortSelect');
            currentSort = select.value;
            renderTree();
        }
        
        function toggleSortOrder() {
            isReverse = !isReverse;
            const btn = document.getElementById('sortOrderBtn');
            btn.innerHTML = isReverse ? '▲' : '▼'; 
            renderTree();
        }

        function updateDynamicInputs() {
            const container = document.getElementById('dynamicInputs');
            container.innerHTML = '';

            groupConfigs.forEach(config => {
                const key = config.name;
                const uniqueValues = getUniqueCategoryValues(key);
                const datalistId = `dl_inp_${encodeURIComponent(key)}`;

                const div = document.createElement('div');
                div.className = 'input-group';
                div.innerHTML = `
                    <label>${escapeHtml(key)}</label>
                    <input type="text" id="inp_${escapeHtml(key)}" placeholder="Value" list="${datalistId}" autocomplete="off">
                    <datalist id="${datalistId}">
                        ${uniqueValues.map(v => `<option value="${escapeHtml(v)}">`).join('')}
                    </datalist>
                `;
                container.appendChild(div);
            });

            updateNewCategoryAutocomplete();
        }

        // --- Hierarchy & Rendering ---

        function buildHierarchy(itemList, keys) {
            if (keys.length === 0) {
                const sorted = itemList.slice().sort((a, b) => {
                    let cmp = 0;
                    if (currentSort === CREATED_KEY) {
                        const dateA = a.createdAt || a._createdAt || a._created || "";
                        const dateB = b.createdAt || b._createdAt || b._created || "";
                        cmp = dateA.localeCompare(dateB);
                    } else if (currentSort === MODIFIED_KEY) {
                        const dateA = a.updatedAt || a._updatedAt || a._modified || (a.createdAt || a._createdAt || a._created || "");
                        const dateB = b.updatedAt || b._updatedAt || b._modified || (b.createdAt || b._createdAt || b._created || "");
                        cmp = dateA.localeCompare(dateB);
                    } else if (currentSort === NAME_KEY) {
                        const nameA = a.name || a.Name || "";
                        const nameB = b.name || b.Name || "";
                        cmp = nameA.localeCompare(nameB);
                    }
                    
                    return isReverse ? -cmp : cmp;
                });
                return sorted;
            }

            const currentKey = keys[0];
            const remainingKeys = keys.slice(1);

            const groups = {};
            itemList.forEach(item => {
                let value;
                if (currentKey === CREATED_KEY) {
                    value = formatDate(item.createdAt || item._createdAt || item._created) || "Unspecified";
                } else if (currentKey === MODIFIED_KEY) {
                    value = formatDate(item.updatedAt || item._updatedAt || item._modified || item.createdAt || item._createdAt || item._created) || "Unspecified";
                } else {
                    value = (item.attributes && item.attributes[currentKey] !== undefined)
                        ? item.attributes[currentKey]
                        : (item[currentKey] || "Unspecified");
                }
                if (!groups[value]) groups[value] = [];
                groups[value].push(item);
            });

            const result = [];
            const sortedGroupNames = Object.keys(groups).sort();
            
            for (const groupName of sortedGroupNames) {
                result.push({
                    type: 'group',
                    name: groupName,
                    children: buildHierarchy(groups[groupName], remainingKeys)
                });
            }
            return result;
        }

        let searchQuery = "";
        let draggedGroupIndex = null;

        function handleSearch(val) {
            searchQuery = (val || "").trim().toLowerCase();
            const clearBtn = document.getElementById('clearSearchBtn');
            if (clearBtn) {
                clearBtn.style.display = searchQuery ? 'block' : 'none';
            }
            renderTree();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            if (input) input.value = '';
            handleSearch('');
        }

        function expandAllGroups() {
            document.querySelectorAll('.group-label.collapsed').forEach(el => el.classList.remove('collapsed'));
            document.querySelectorAll('.group-content.collapsed').forEach(el => el.classList.remove('collapsed'));
        }

        function collapseAllGroups() {
            document.querySelectorAll('.group-label').forEach(el => el.classList.add('collapsed'));
            document.querySelectorAll('.group-content').forEach(el => el.classList.add('collapsed'));
        }

        function renderTree() {
            const root = document.getElementById('treeRoot');
            root.innerHTML = '';
            
            updateSortUI();

            const countBadge = document.getElementById('itemCountHeader');
            if (countBadge) {
                countBadge.textContent = items.length === 1 ? '(1 item)' : `(${items.length} items)`;
            }

            if (items.length === 0) {
                root.innerHTML = '<div class="empty-state">No items. Add one from the sidebar.</div>';
                return;
            }

            let displayItems = items;
            if (searchQuery) {
                displayItems = items.filter(item => {
                    const itemName = item.name || item.Name || '';
                    if (itemName.toLowerCase().includes(searchQuery)) return true;
                    if (item.attributes) {
                        for (const val of Object.values(item.attributes)) {
                            if (String(val || '').toLowerCase().includes(searchQuery)) return true;
                        }
                    } else {
                        for (const key of Object.keys(item)) {
                            if (!key.startsWith('_') && key !== 'Name' && key !== 'id') {
                                const val = String(item[key] || '').toLowerCase();
                                if (val.includes(searchQuery)) return true;
                            }
                        }
                    }
                    return false;
                });

                if (countBadge) {
                    countBadge.textContent = `(${displayItems.length} of ${items.length} items)`;
                }

                if (displayItems.length === 0) {
                    root.innerHTML = `<div class="empty-state">No matches found for "${escapeHtml(searchQuery)}".</div>`;
                    return;
                }
            }

            const activeKeys = groupConfigs.filter(g => g.active).map(g => g.name);
            const hierarchy = buildHierarchy(displayItems, activeKeys);
            const listElement = createListElement(hierarchy, !!searchQuery);
            root.appendChild(listElement);
        }

        function createListElement(nodes, autoExpand = false) {
            const ul = document.createElement('ul');

            nodes.forEach(node => {
                const li = document.createElement('li');
                
                if (node.type === 'group') {
                    // Group Row
                    const label = document.createElement('div');
                    label.className = 'group-label';
                    label.innerHTML = `${escapeHtml(node.name)} <span class="count-badge">${countItems(node)}</span>`;
                    
                    label.onclick = function() {
                        this.classList.toggle('collapsed');
                        const content = this.nextElementSibling;
                        if (content) content.classList.toggle('collapsed');
                    };

                    li.appendChild(label);

                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'group-content';
                    childrenContainer.appendChild(createListElement(node.children, autoExpand));
                    li.appendChild(childrenContainer);

                } else {
                    // Item Row
                    li.className = 'item-node';
                    
                    const nameSpan = document.createElement('div');
                    nameSpan.className = 'item-name';
                    nameSpan.textContent = node.name || node.Name || '';
                    
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'item-meta';
                    
                    const createdDate = formatDate(node.createdAt || node._createdAt || node._created);
                    const modifiedDate = formatDate(node.updatedAt || node._updatedAt || node._modified || node.createdAt || node._createdAt || node._created);
                    
                    metaDiv.innerHTML = `
                        <div class="date-line" title="Created: ${createdDate} | Modified: ${modifiedDate}">
                            <span style="opacity:0.5">C:</span> ${createdDate}
                            <span style="opacity:0.5; margin-left:6px;">M:</span> ${modifiedDate}
                        </div>
                    `;
                    
                    // Hidden actions (absolute)
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'item-actions';
                    
                    const editBtn = document.createElement('button');
                    editBtn.className = 'action-btn';
                    editBtn.textContent = 'Edit';
                    editBtn.onclick = () => openEditModal(node);
                    
                    const sep = document.createElement('span');
                    sep.style.color = '#444';
                    sep.textContent = ' | ';

                    const delBtn = document.createElement('button');
                    delBtn.className = 'action-btn del';
                    delBtn.textContent = 'Delete';
                    delBtn.onclick = () => deleteItem(node);

                    actionsDiv.appendChild(editBtn);
                    actionsDiv.appendChild(sep);
                    actionsDiv.appendChild(delBtn);

                    li.appendChild(nameSpan);
                    li.appendChild(metaDiv);
                    li.appendChild(actionsDiv); // Actions now outside meta, inside item-node (relative parent)
                }
                ul.appendChild(li);
            });
            return ul;
        }

        function countItems(node) {
            if (!node.children) return 1;
            if (Array.isArray(node.children) && node.children.length > 0 && !node.children[0].type) {
                return node.children.length;
            }
            return node.children.reduce((acc, child) => acc + countItems(child), 0);
        }

        // --- Sorting UI ---

        function updateSortUI() {
            const container = document.getElementById('sortContainer');
            container.innerHTML = '';

            groupConfigs.forEach((config, index) => {
                const div = document.createElement('div');
                div.className = `sort-item ${config.active ? '' : 'disabled'}`;
                div.draggable = true;
                div.title = "Drag to reorder or click arrows";

                div.ondragstart = (e) => {
                    draggedGroupIndex = index;
                    e.dataTransfer.effectAllowed = 'move';
                    div.classList.add('dragging');
                };

                div.ondragend = () => {
                    div.classList.remove('dragging');
                    document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('drag-over'));
                };

                div.ondragover = (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    div.classList.add('drag-over');
                };

                div.ondragleave = () => {
                    div.classList.remove('drag-over');
                };

                div.ondrop = (e) => {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    if (draggedGroupIndex !== null && draggedGroupIndex !== index) {
                        const [moved] = groupConfigs.splice(draggedGroupIndex, 1);
                        groupConfigs.splice(index, 0, moved);
                        updateDynamicInputs();
                        updateSortUI();
                        renderTree();
                    }
                    draggedGroupIndex = null;
                };
                
                const leftDiv = document.createElement('div');
                leftDiv.className = 'sort-left';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = config.active;
                checkbox.onclick = () => toggleGroupKey(index);

                const label = document.createElement('span');
                label.textContent = config.name;
                
                leftDiv.append(checkbox, label);
                
                const controls = document.createElement('div');
                controls.className = 'sort-controls';

                const upBtn = document.createElement('button');
                upBtn.textContent = '▲';
                if(index === 0) upBtn.disabled = true; 
                else upBtn.onclick = () => moveKey(index, -1);
                
                const downBtn = document.createElement('button');
                downBtn.textContent = '▼';
                if(index === groupConfigs.length - 1) downBtn.disabled = true; 
                else downBtn.onclick = () => moveKey(index, 1);

                const rmBtn = document.createElement('button');
                rmBtn.textContent = '×';
                rmBtn.style.color = 'var(--text-secondary)';
                rmBtn.onmouseover = function(){ this.style.color = 'var(--danger)'; };
                rmBtn.onmouseout = function(){ this.style.color = 'var(--text-secondary)'; };
                rmBtn.onclick = () => removeGroupKey(config.name);

                controls.append(upBtn, downBtn, rmBtn);
                div.appendChild(leftDiv);
                div.appendChild(controls);
                container.appendChild(div);
            });
        }

        function moveKey(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= groupConfigs.length) return;
            [groupConfigs[index], groupConfigs[newIndex]] = [groupConfigs[newIndex], groupConfigs[index]];
            updateDynamicInputs();
            renderTree();
        }

        // --- Import / Export & Schema v2 ---

        function serializeDataset() {
            return {
                version: 2,
                settings: {
                    sortLeavesBy: currentSort,
                    isReverse: isReverse
                },
                groupConfigs: groupConfigs,
                items: items.map(item => ({
                    id: item.id || generateId('char'),
                    name: item.name || item.Name || '',
                    createdAt: item.createdAt || item._createdAt || item._created || new Date().toISOString(),
                    updatedAt: item.updatedAt || item._updatedAt || item._modified || item.createdAt || new Date().toISOString(),
                    attributes: item.attributes || {}
                }))
            };
        }

        function exportData() {
            const dataStr = JSON.stringify(serializeDataset(), null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "group_sorter_data_v2.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function applyImportedData(data) {
            if (!data || !data.items || !Array.isArray(data.items)) return;

            // Restore settings if present (v2 schema)
            if (data.settings) {
                if (data.settings.sortLeavesBy) {
                    currentSort = data.settings.sortLeavesBy;
                    const sortSel = document.getElementById('sortSelect');
                    if (sortSel) sortSel.value = currentSort;
                }
                if (typeof data.settings.isReverse === 'boolean') {
                    isReverse = data.settings.isReverse;
                    const btn = document.getElementById('sortOrderBtn');
                    if (btn) btn.innerHTML = isReverse ? '▲' : '▼';
                }
            }

            if (data.groupConfigs && Array.isArray(data.groupConfigs)) {
                groupConfigs = data.groupConfigs.filter(g => !SYSTEM_KEYS.includes(g.name));
            }

            // Normalize all items to standard v2 schema
            items = data.items.map((rawItem, idx) => {
                const name = rawItem.name || rawItem.Name || `Item ${idx + 1}`;

                let createdIso = rawItem.createdAt || rawItem._createdAt || rawItem._created;
                if (!createdIso) {
                    if (rawItem[CREATED_KEY]) {
                        const parsed = new Date(rawItem[CREATED_KEY]);
                        createdIso = isNaN(parsed.getTime()) ? new Date().toISOString() : parsed.toISOString();
                    } else {
                        createdIso = new Date().toISOString();
                    }
                }

                let updatedIso = rawItem.updatedAt || rawItem._updatedAt || rawItem._modified || rawItem.modifiedAt;
                if (!updatedIso) {
                    if (rawItem[MODIFIED_KEY]) {
                        const parsed = new Date(rawItem[MODIFIED_KEY]);
                        updatedIso = isNaN(parsed.getTime()) ? createdIso : parsed.toISOString();
                    } else {
                        updatedIso = createdIso;
                    }
                }

                const id = rawItem.id || generateId('char');

                let attributes = {};
                if (rawItem.attributes && typeof rawItem.attributes === 'object' && !Array.isArray(rawItem.attributes)) {
                    attributes = { ...rawItem.attributes };
                } else {
                    const excludedKeys = new Set([
                        'id', 'name', 'Name',
                        'createdAt', 'updatedAt',
                        '_createdAt', '_updatedAt',
                        '_created', '_modified',
                        'Creation Date', 'Modification Date',
                        CREATED_KEY, MODIFIED_KEY,
                        'modifiedAt'
                    ]);
                    for (const [k, v] of Object.entries(rawItem)) {
                        if (!excludedKeys.has(k) && !k.startsWith('_')) {
                            attributes[k] = v;
                        }
                    }
                }

                return {
                    id,
                    name,
                    createdAt: createdIso,
                    updatedAt: updatedIso,
                    attributes
                };
            });

            updateDynamicInputs();
            renderTree();
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    applyImportedData(data);
                } catch (err) { alert("Error parsing JSON."); }
                input.value = '';
            };
            reader.readAsText(file);
        }

        async function loadExample() {
            try {
                const res = await fetch('./data/sample-template.json?v=20261112T033000Z', { cache: 'no-cache' });
                if (res.ok) {
                    const data = await res.json();
                    applyImportedData(data);
                    return;
                }
            } catch (err) {}

            const createWithDate = (name, createdStr, modStr, attributes) => {
                const dateObj = new Date(createdStr);
                const modObj = modStr ? new Date(modStr) : dateObj;
                return {
                    id: generateId('char'),
                    name: name,
                    createdAt: dateObj.toISOString(),
                    updatedAt: modObj.toISOString(),
                    attributes: attributes
                };
            };

            items = [
                createWithDate("Lelouch vi Britannia", "2024-01-01T00:01:00", null, { Series: "Code Geass", Role: "Strategist", Tier: "S+" }),
                createWithDate("C.C.", "2024-01-02T18:45:00", null, { Series: "Code Geass", Role: "Immortal", Tier: "S" }),
                createWithDate("Isagi Yoichi", "2023-03-10T14:20:00", null, { Series: "Blue Lock", Role: "Striker", Tier: "S" }),
                createWithDate("Bachira Meguru", "2023-03-12T09:15:00", "2024-01-20T10:00:00", { Series: "Blue Lock", Role: "Dribbler", Tier: "A+" }),
                createWithDate("Emilia", "2025-05-01T12:00:00", null, { Series: "Re:Zero", Role: "Spirit Arts", Tier: "S" }),
                createWithDate("Rem", "2025-05-02T08:30:00", null, { Series: "Re:Zero", Role: "Oni Maid", Tier: "A" })
            ];
            
            groupConfigs = [
                { name: 'Series', active: true },
                { name: 'Role', active: true },
                { name: 'Tier', active: false }
            ];
            updateDynamicInputs();
            renderTree();
        }

        function clearAll() {
            if((items.length > 0 || groupConfigs.length > 0) && confirm("Delete all items and groups?")) {
                items = [];
                groupConfigs = [];
                updateDynamicInputs();
                updateSortUI();
                renderTree();
            }
        }

        // --- Server Integration & Auto-Loading ---
        let heartbeatInterval = null;

        function startHeartbeat() {
            function sendHeartbeat() {
                fetch('/api/heartbeat', { method: 'POST', keepalive: true }).catch(() => {});
            }
            sendHeartbeat();
            if (!heartbeatInterval) {
                heartbeatInterval = setInterval(sendHeartbeat, 1500);
            }
        }

        window.addEventListener('pagehide', () => {
            if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/shutdown');
            } else {
                fetch('/api/shutdown', { method: 'POST', keepalive: true }).catch(() => {});
            }
        });

        async function loadGroupFilesList() {
            const select = document.getElementById('savedGroupSelect');
            if (!select) return;

            try {
                const res = await fetch('/api/groups', { cache: 'no-cache' });
                if (!res.ok) throw new Error("API not available");
                const files = await res.json();

                select.innerHTML = '';
                if (!files || files.length === 0) {
                    select.innerHTML = '<option value="">(No files in groups/)</option>';
                    return;
                }

                files.forEach(file => {
                    const opt = document.createElement('option');
                    opt.value = file.filename;
                    opt.textContent = file.name;
                    select.appendChild(opt);
                });

                // Auto-load preferred file (v2 first, then replica, then first available)
                const preferred = files.find(f => f.filename.includes('v2')) || files.find(f => f.filename.includes('replica')) || files[0];
                select.value = preferred.filename;
                await loadGroupFile(preferred.filename);
            } catch (err) {
                if (select) {
                    select.innerHTML = '<option value="">(Standalone / No Server)</option>';
                }
            }
        }

        async function onSavedGroupSelected() {
            const select = document.getElementById('savedGroupSelect');
            if (!select || !select.value) return;
            await loadGroupFile(select.value);
        }

        async function loadGroupFile(filename) {
            try {
                const res = await fetch(`./groups/${encodeURIComponent(filename)}`, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                applyImportedData(data);
            } catch (err) {
                console.error("Failed to load group file:", err);
            }
        }

        async function saveCurrentGroupFile() {
            const select = document.getElementById('savedGroupSelect');
            const filename = select ? select.value : "";
            if (!filename) {
                return saveAsNewGroupFile();
            }
            await performSave(filename);
        }

        async function saveAsNewGroupFile() {
            const promptName = prompt("Enter filename to save in groups/ (e.g. my-list.json):", "my-characters-v2.json");
            if (!promptName) return;
            let filename = promptName.trim();
            if (!filename.endsWith(".json")) filename += ".json";
            await performSave(filename, true);
        }

        async function performSave(filename, isNew = false) {
            const saveBtn = document.getElementById('saveBtn');
            const statusMsg = document.getElementById('saveStatusMsg');

            try {
                if (saveBtn) saveBtn.textContent = 'Saving...';

                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: filename,
                        data: serializeDataset()
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || `HTTP ${res.status}`);
                }

                const result = await res.json();
                if (saveBtn) {
                    saveBtn.textContent = 'Saved ✓';
                    setTimeout(() => { saveBtn.textContent = 'Save'; }, 1500);
                }
                if (statusMsg) {
                    statusMsg.textContent = `Saved to ${result.filename} ✓`;
                    statusMsg.style.display = 'block';
                    setTimeout(() => { statusMsg.style.display = 'none'; }, 2500);
                }

                if (isNew) {
                    await loadGroupFilesList();
                    const select = document.getElementById('savedGroupSelect');
                    if (select) select.value = result.filename;
                }
            } catch (err) {
                alert("Failed to save: " + err.message);
                if (saveBtn) saveBtn.textContent = 'Save';
            }
        }

        // Global keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            // Save on Ctrl+S / Cmd+S
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveCurrentGroupFile();
            }
            // Focus search on '/' or 'Ctrl+F'
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                const searchInput = document.getElementById('searchInput');
                if (searchInput) searchInput.focus();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
                const searchInput = document.getElementById('searchInput');
                if (searchInput && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            }
            // Clear search on Escape
            if (e.key === 'Escape' && document.activeElement.id === 'searchInput') {
                clearSearch();
                document.activeElement.blur();
            }
        });

        // Init
        updateDynamicInputs();
        renderTree();

        // Server initialization & auto-load groups
        startHeartbeat();
        loadGroupFilesList();

    </script>
